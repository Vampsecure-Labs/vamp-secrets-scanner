[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-secrets-scanner"
version = "2.7.0"
description = "Static secrets and credentials scanner with git history analysis, Shannon entropy detection, SARIF 2.1.0 output, Docker runtime scanning, Kubernetes Secrets scanning, daemon watch mode, delta scan · librería importable"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "secrets", "credentials", "scanner", "pentest", "sast", "sarif", "entropy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rich>=13.7.0"]

[project.scripts]
vamp-secrets-scanner = "vamp_secrets_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-secrets-scanner"
Repository = "https://github.com/Vampsecure-Labs/vamp-secrets-scanner"
"Bug Tracker" = "https://github.com/Vampsecure-Labs/vamp-secrets-scanner/issues"

[tool.setuptools]
packages = ["vamp_secrets_scanner"]
py-modules = ["vampsec_report"]
