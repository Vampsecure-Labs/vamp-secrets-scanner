# gitleaks configuration — VampSecure Labs
# https://github.com/gitleaks/gitleaks

title = "VampSecure Labs gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Example/demo tokens in documentation"
regexes = [
  # JWT examples with clearly fake signatures (EXAMPLE_SIG, FORGED_SIG, .example., .sig)
  '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.(EXAMPLE_SIG|FORGED_SIG|EXAMPLE|FORGED)''',
  # Truncated JWTs used in CLI examples (end with ...)
  '''eyJ[A-Za-z0-9_-]+\.\.\.$''',
  # Fake JWT with .example. or .sig as payload/signature
  '''eyJ[A-Za-z0-9_-]+\.(example|sig|payload)\.(example|sig)''',
]
paths = [
  '''README\.md''',
  '''docs/.*''',
  '''\.github/.*''',
]

[[allowlists]]
description = "Test fixtures — synthetic secrets used to verify scanner detection (not real credentials)"
paths = [
  '''tests/.*''',
  '''test_.*\.py''',
  '''.*_test\.py''',
  '''conftest\.py''',
]

[[allowlists]]
description = "Scanner internal patterns — regex strings and sample output that match secret patterns by design"
# stopwords match against the extracted secret value
stopwords = [
  "VAULT_SKIP_VERIFY",
  "BEGIN RSA PRIVATE KEY",
  "BEGIN OPENSSH PRIVATE KEY",
  "BEGIN EC PRIVATE KEY",
  "BEGIN PRIVATE KEY",
]
# also covers historical commits where vamp_secrets_scanner.py existed as a flat file
paths = [
  '''vamp_secrets_scanner\.py''',
  '''vamp_secrets_scanner/.*\.py''',
]
